function mk(n){const a=Array(n).fill(0);a[wpick(0,n)]=1;return a}

function apply(m){
  S.last=null;
  if(m.t==='join'){if(!S.players[m.pid]&&S.order.length<24){S.players[m.pid]={name:String(m.name).slice(0,16)||tr('لاعب'),alive:true,shots:0,pos:0,hit:-1,spec:!!m.online&&S.order.some(id=>S.players[id].pos>0),dup:!!m.dup,on:true};CH[m.pid]=mk(S.n);S.order.push(m.pid)}}
  else if(m.t==='pull'||m.t==='hpull'){const p=S.players[m.pid];if(!p||!p.alive||p.dup||p.spec||p.pos>=S.n)return;
    if(m.t==='hpull'&&p.pos>=S.n-1){toast(tr('هذه آخر طلقة — القرار للاعب نفسه'),1);return}
    const live=CH[m.pid][p.pos];p.pos++;p.shots++;if(live){p.alive=false;p.hit=p.pos-1;p.dead=(p.dead||0)+1}else p.ok=(p.ok||0)+1;S.last={t:'shot',pid:m.pid,live:!!live,host:m.t==='hpull'}}
  else if(m.t==='rename'){const p=S.players[m.pid];if(p){p.name=String(m.name).slice(0,16);p.dup=false}}
  else if(m.t==='one'){const p=S.players[m.pid];if(p){Object.assign(p,{alive:true,shots:0,pos:0,hit:-1,spec:false});CH[m.pid]=mk(S.n);S.last={t:'reload1',pid:m.pid}}}
  else if(m.t==='mode')resetAll(m.idx,{mode:m.idx});
  else if(m.t==='vote'){if(S.players[m.pid]&&!S.votes.includes(m.pid))S.votes.push(m.pid);voteCheck()}
  else if(m.t==='unvote')S.votes=S.votes.filter(x=>x!==m.pid);
  else if(m.t==='newround')resetAll(S.mode);
  else if(m.t==='kick'){const kn=(S.players[m.pid]||{}).name;delete S.players[m.pid];delete CH[m.pid];S.last={t:'left',name:kn};S.order=S.order.filter(x=>x!==m.pid);S.votes=S.votes.filter(x=>x!==m.pid)}

function voteCheck(){const ids=S.order.filter(id=>S.players[id].on!==false&&!S.players[id].dup);if(ids.length&&ids.every(id=>S.votes.includes(id)))resetAll(S.mode)}

  if(S)render();else{$('trig').querySelector('span').textContent=tr('الزناد');$('reload').textContent=tr('إعادة التلقيم')}
}
function applyTheme(){document.documentElement.dataset.theme=theme;document.documentElement.classList.toggle('light-mode',theme==='light');document.body.classList.toggle('light-mode',theme==='light');try{$('cs').setAttribute('content',theme==='light'?'light':'dark')}catch(e){}try{$('tc').setAttribute('content',theme==='light'?'#f7f1e7':'#0a0807')}catch(e){}$('themeB').innerHTML=ico(theme==='light'?'moon':'sun');if(S)render()}
$('langB').onclick=()=>{lang=lang==='en'?'ar':'en';try{localStorage.setItem('lb_lang',lang)}catch(e){}applyLang()};
$('themeB').onclick=()=>{theme=theme==='light'?'dark':'light';try{localStorage.setItem('lb_theme',theme)}catch(e){}applyTheme()};
(async function init(){
  applyTheme();applyLang();
  const sv=getName();if(sv){$('cName').value=sv;$('jName').value=sv;offNames[0]=sv}
  $('muteB').innerHTML=ico(MUTE?'mute':'vol');
  const q=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,5);
  let sess=null;try{sess=JSON.parse(localStorage.getItem('lb_session'))}catch(e){}
  if(sess&&sess.code&&(!q||q===sess.code)&&await resume(sess))return;
  if(q){go('onl');tab('J');$('jCode').value=q;$('jName').focus()}
})();
})();
</script>
