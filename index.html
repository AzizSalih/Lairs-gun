<style>
:root{--bg:#0a0807;--line:#2a2118;--fg:#f3eadf;--mut:#a39383;--acc:#d4a04a;--red:#e0402e;--neon:#ff8a3d;color-scheme:dark}

function apply(m){

    if(m.t==='hpull'&&p.pos>=S.n-1){toast(tr('هذه آخر طلقة — القرار للاعب نفسه'),1);return}

  h+='</g><circle cx="150" cy="150" r="30" fill="url(#mg)" stroke="#c9cdd3" stroke-width="3"/><circle cx="150" cy="150" r="9" fill="#3b3f45"/><path d="M136 4 L164 4 L150 34 Z" fill="#e0402e" stroke="#ffb3a8" stroke-width="1.5"/>';
  if(theme!=='light'){for(const m of DARKMAP)h=h.split(m[0]).join(m[1])}
  $('cyl').innerHTML=h;
  const same=lastV===vid;lastV=vid;let to=P.pos*360/n+360*spins;
  if(same&&to<tgt-.01){spins++;to+=360}
  if(!same){tgt=to;setAng(to,0)}else if(to!==tgt){tgt=to;setAng(to,isRel?2000:430,isRel?eIO:eBack)}
}
function onState(s){
  S=s;const l=S.last;
  if(l&&S.seq>lastSeq&&lastSeq>0){const nm=(S.players[l.pid]||{}).name||tr('لاعب');
    if(l.t==='shot'){sRot();if(l.host)toast(tr('المنظم قام بسحب الزناد لـ ')+nm);
      {if(l.live){sBang();fx('bang');sparks();gore();buzz([300,80,300]);deathNote(nm)}
        else{sClick();fx('click');buzz(40)}}}
    else if(l.t==='reload'){clearAlerts();sRot(true)}
    else if(l.t==='left')leaveNote(l.name);
    else if(l.t==='reload1'){clearAlerts();sRot(true);setMsg(tr('أُعيد تلقيم وأُحيي ')+nm)}
    if(l.t==='reload')setMsg(l.mode!=null?tr('تغيّر الطور إلى «')+tr(MODES[S.mode][0])+tr('» وأُعيد تلقيم الجميع'):tr('تمت إعادة التلقيم'))}
  lastSeq=S.seq;render();
}
function render(){
  if(!S)return;
  const mode=MODES[S.mode],okLocal=local.filter(p=>S.players[p]);
  if(!S.players[sel]||!S.players[sel].alive){const a=okLocal.find(p=>S.players[p].alive&&!S.players[p].spec)||okLocal[0];if(a)sel=a}
  if(viewId&&!S.players[viewId])viewId=null;
  const vid=viewId||sel,vp=S.players[vid];if(!vp)return;curView=vid;
  const mineV=local.includes(vid);
  $('rcode').innerHTML=code+ico('copy');$('rcode').classList.toggle('hide',!(online&&code&&cur==='game'));
  $('vname').textContent=(S.n-vp.pos)+' / '+S.n;
  drawCyl(vp,vid);
  $('mine').innerHTML=okLocal.map(p=>'<span class="chip '+(p===vid?'on':'')+'" data-p="'+p+'">'+esc(S.players[p].name)+(S.players[p].spec?' '+ico('eye'):'')+(S.players[p].alive?'':' '+ico('skull','bad'))+'</span>').join('');
  $('trig').disabled=!(mineV&&vp.alive&&!vp.spec&&vp.pos<S.n);
  $('trig').querySelector('span').textContent=!mineV?tr('مسدس لاعب آخر'):vp.spec?tr('مشاهد — بانتظار الجولة الجديدة'):vp.pos>=S.n?tr('المسدس فارغ — أعد التلقيم'):!vp.alive?tr('أنت ميت'):tr('الزناد');
  const lastB=mineV&&vp.alive&&!vp.spec&&vp.pos===S.n-1;$('trig').classList.toggle('last',lastB);$('lastHint').textContent='';
  const need=S.need!=null?S.need:S.order.length,got=S.gotv!=null?S.gotv:S.votes.length;
  {const mv=local.filter(p=>S.players[p]),voted=online&&mv.length>0&&mv.every(p=>S.votes.includes(p));$('reload').textContent=online?(voted?tr('إلغاء طلب إعادة التلقيم'):tr('إعادة التلقيم'))+' ('+got+'/'+need+')':tr('إعادة التلقيم')}
  $('voteInfo').textContent=online&&got?tr('تصويت إعادة التلقيم: ')+got+tr(' من ')+need:'';
  $('share').classList.toggle('hide',!online);
  $('plist').innerHTML=S.order.map(id=>{const p=S.players[id];let d='';for(let i=0;i<S.n;i++)d+='<i style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:3px;background:'+(i===p.hit?'#e0402e':i<p.pos?'#3a2f28':'#d4a04a')+'"></i>';
    return '<div class="pl '+(p.alive?'':'dead')+'" data-v="'+id+'" style="cursor:pointer'+(p.on===false?';opacity:.5':'')+(id===vid?';background:#d4a04a14':'')+'"><div><b'+(local.includes(id)?' data-rn="'+id+'" style="cursor:text"':'')+'>'+(S.host===id?ico('crown','crown')+' ':'')+esc(p.name)+'</b>'+(local.includes(id)?' <span data-rn="'+id+'" style="cursor:pointer;opacity:.75">'+ico('pencil')+'</span>':'')+'<small>'+ico(p.spec?'eye':p.alive?'heart':'skull',p.spec?'':p.alive?'ok':'bad')+' '+(p.spec?tr('مشاهد'):p.alive?tr('حي'):tr('ميت'))+'</small></div><div>'+d+'</div></div>'}).join('');
  const arr=S.order.map(id=>S.players[id]),mx=Math.max(0,...arr.map(p=>p.ok||0)),risk=mx>0?arr.filter(p=>(p.ok||0)===mx).map(p=>esc(p.name)).join(tr('، ')):'—';
  $('statsp').innerHTML=tr('<h3>إحصائيات اللعب</h3><div class="st head"><span>اللاعب</span><span>ناجية</span><span>موت</span></div>')+arr.map(p=>'<div class="st"><span>'+(S.host&&S.order[arr.indexOf(p)]===S.host?ico('crown','crown')+' ':'')+esc(p.name)+'</span><span>'+(p.ok||0)+'</span><span>'+(p.dead||0)+'</span></div>').join('')+tr('<div class="sub" style="margin:10px 0 0">أكثر لاعب مخاطرة: <b style="color:var(--acc)">')+risk+'</b>'+(mx?' — '+mx+tr(' سحبة ناجية'):'')+'</div>';
  winCheck();paint('hcards',S.mode);const showH=(online&&isHost)||(!online&&cur==='game');$('hostB').classList.toggle('hide',!showH);if(!showH)$('hmod').classList.add('hide');
    if(!hold)$('hostp').innerHTML=isHost?S.order.map(id=>{const p=S.players[id];return '<div class="hrow '+(p.alive?'':'dead')+'"><b class="hn">'+esc(p.name)+'</b><div class="tools"><button class="g" data-a="minus" data-p="'+id+tr('">+ إضافة طلقة</button><button class="r hp" data-a="hpull" data-p="')+id+tr('">رمي الطلقة</button><button class="g" data-a="one" data-p="')+id+tr('">إعادة تلقيم وإحياء</button>')+((online?id!==S.host:S.order.length>1)?'<button class="g" data-a="kick" data-p="'+id+tr('">طرد</button>'):'')+'</div></div>'}).join(''):'';
}
$('mine').onclick=e=>{const p=e.target.dataset.p;if(p){sel=p;viewId=null;render()}};
$('plist').onclick=e=>{const rn=e.target.closest('[data-rn]');if(rn){openName(rn.dataset.rn);return}const r=e.target.closest('[data-v]');if(r){viewId=r.dataset.v;if(local.includes(viewId))sel=viewId;render()}};
$('hostp').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.p,a=b.dataset.a;
  if(a==='minus')act({t:'adj',pid:p,d:-1});
  if(a==='one')act({t:'one',pid:p});
  if(a==='kick')act({t:'kick',pid:p})};
const HP=1500;
$('hostp').addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-a="hpull"]');if(!b)return;e.preventDefault();hold={p:b.dataset.p,t0:performance.now(),raf:0};hpTick()});
function hpBtn(p){return $('hostp').querySelector('button[data-a="hpull"][data-p="'+p+'"]')}
function hpTick(){if(!hold)return;const k=Math.min(1,(performance.now()-hold.t0)/HP),b=hpBtn(hold.p);if(b)b.style.setProperty('--hp',k);
  if(k>=1){const p=hold.p;hold=null;buzz(0);act({t:'hpull',pid:p});render();return}hold.raf=requestAnimationFrame(hpTick)}
function hpEnd(){if(!hold)return;cancelAnimationFrame(hold.raf);const b=hpBtn(hold.p);if(b)b.style.setProperty('--hp',0);hold=null;render()}
document.addEventListener('pointerup',hpEnd);document.addEventListener('pointercancel',hpEnd);
const RP=1200;let rhold=null;
function reloadDo(){if(!S)return;if(!online){S.order.forEach(id=>apply({t:'vote',pid:id}));return}
  const mine=local.filter(p=>S.players[p]);if(!mine.length)return;
  const voted=mine.every(p=>S.votes.includes(p));mine.forEach(p=>act({t:voted?'unvote':'vote',pid:p}))}
function rpTick(){if(!rhold)return;const k=Math.min(1,(performance.now()-rhold.t0)/RP);$('reload').style.setProperty('--rp',k);
  if(k>=1){rhold=null;$('reload').style.setProperty('--rp',0);buzz(0);reloadDo();return}rhold.raf=requestAnimationFrame(rpTick)}
function rpEnd(){if(!rhold)return;cancelAnimationFrame(rhold.raf);$('reload').style.setProperty('--rp',0);rhold=null;buzz(0)}
$('reload').addEventListener('pointerdown',e=>{e.preventDefault();rhold={t0:performance.now(),raf:0};sTrig();buzz(Array(12).fill([40,60]).flat());rpTick()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('reload').addEventListener(ev,rpEnd));
$('reload').addEventListener('contextmenu',e=>e.preventDefault());
let nmPid=null;
function openName(pid){if(!S||!S.players[pid])return;nmPid=pid;$('nmIn').value=S.players[pid].name;$('nmod').classList.remove('hide');$('nmIn').focus()}
function closeName(){$('nmod').classList.add('hide');nmPid=null}
function saveNick(){const v=$('nmIn').value.trim().slice(0,16),pid=nmPid;closeName();if(!v||!pid)return;
  if(online)ROOM.child('players/'+pid).transaction(p=>{if(!p)return p;p.name=v;return p});else apply({t:'rename',pid,name:v})}
$('nmOk').onclick=saveNick;$('nmNo').onclick=closeName;
$('nmIn').addEventListener('keydown',e=>{if(e.key==='Enter')saveNick()});
let wKey=null,wDone=null;
function winCheck(){const al=S.order.filter(id=>S.players[id].alive&&!S.players[id].spec),dd=S.order.some(id=>!S.players[id].alive&&!S.players[id].spec);
  if(S.order.length>=2&&al.length===1&&dd){const wid=al[0],key=(S.round||0)+':'+wid;
    if(key!==wDone&&key!==wKey){wKey=key;setTimeout(()=>{if(wKey!==key||!S)return;const p=S.players[wid];if(!p)return;$('wname').textContent=p.name;$('wsub').textContent=tr('نجا من ')+p.shots+tr(' سحبة في هذه الجولة');$('wmod').classList.remove('hide');fanfare()},1500)}}
  else{wKey=null;wDone=null;$('wmod').classList.add('hide')}}
$('wclose').onclick=()=>{wDone=wKey;$('wmod').classList.add('hide')};
$('wnew').onclick=()=>{clearAlerts();wDone=wKey;$('wmod').classList.add('hide');if(!S)return;
  if(!online)S.order.forEach(id=>apply({t:'vote',pid:id}));
  else if(isHost)act({t:'newround'});
  else{local.filter(p=>S.players[p]).forEach(p=>act({t:'vote',pid:p}));toast(tr('تم إرسال طلب جولة جديدة'))}};
$('hostB').onclick=()=>{$('hmod').classList.remove('hide');if(S)render()};
$('hClose').onclick=()=>$('hmod').classList.add('hide');
$('hmod').onclick=e=>{if(e.target===$('hmod'))$('hmod').classList.add('hide')};
$('addB').onclick=()=>{$('addRow').classList.toggle('hide');if(!$('addRow').classList.contains('hide'))$('more').focus()};

/* ---------- الزناد: ضغط مطوّل ---------- */
const trig=$('trig');let t0=0,raf=0,holding=false;
function tick(){if(!holding)return;const k=Math.min(1,(performance.now()-t0)/HOLD);trig.style.setProperty('--p',k);$('cyl').style.transform='scale('+(1+.06*k)+')';if(k>=1){fire();return}raf=requestAnimationFrame(tick)}
function cancel(){if(!holding)return;holding=false;cancelAnimationFrame(raf);chargeStop();buzz(0);trig.style.setProperty('--p',0);$('cyl').style.transform=''}
function fire(){holding=false;chargeStop();buzz(0);trig.style.setProperty('--p',0);$('cyl').style.transform='';act({t:'pull',pid:curView})}
trig.addEventListener('pointerdown',e=>{if(trig.disabled)return;e.preventDefault();try{trig.setPointerCapture(e.pointerId)}catch(_){}
  holding=true;t0=performance.now();tapFx();sTrig();chargeStart();buzz(Array(30).fill([40,60]).flat());raf=requestAnimationFrame(tick)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>trig.addEventListener(ev,cancel));
trig.addEventListener('contextmenu',e=>e.preventDefault());

$('muteB').onclick=()=>{MUTE=!MUTE;try{localStorage.setItem('lb_mute',MUTE?'1':'0')}catch(e){}$('muteB').innerHTML=ico(MUTE?'mute':'vol')};
/* ---------- البدء: استئناف الجلسة أو الانضمام عبر الرابط ---------- */
const DYN='#info,#vname,#mine,#plist,#hostp,#statsp,#msg,#voteInfo,#trig,#reload,#offNames,.mcs,#toast,#jErr,#leaveT,#lastHint,#wname,#wsub';
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){const pe=n.parentElement;if(!pe||pe.closest(DYN)||/^(SCRIPT|STYLE)$/.test(pe.tagName))continue;
    if(n._ar===undefined){const k=n.nodeValue.trim();if(!/[\u0600-\u06FF]/.test(k))continue;n._ar=n.nodeValue;n._k=k}
    n.nodeValue=(lang==='en'&&DICT[n._k]!=null)?n._ar.replace(n._k,DICT[n._k]):n._ar}
  document.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{if(!el.hasAttribute(a))return;const d='_a_'+a;
    if(el[d]===undefined){if(!/[\u0600-\u06FF]/.test(el.getAttribute(a)))return;el[d]=el.getAttribute(a)}
    el.setAttribute(a,(lang==='en'&&DICT[el[d]]!=null)?DICT[el[d]]:el[d])}));
  document.title=tr('مسدس الحانة');$('langB').textContent=lang==='en'?'ع':'EN';
  for(const id in cards.f)cards(id,cards.f[id]);paint('ocards',offMode);paint('ccards',crMode);if(S)paint('hcards',S.mode);
  if($('offNames').children.length)offRender();
  if(S)render();else{$('trig').querySelector('span').textContent=tr('الزناد');$('reload').textContent=tr('إعادة التلقيم')}
}
function applyTheme(){document.documentElement.dataset.theme=theme;document.documentElement.classList.toggle('light-mode',theme==='light');document.body.classList.toggle('light-mode',theme==='light');try{$('cs').setAttribute('content',theme==='light'?'light':'dark')}catch(e){}try{$('tc').setAttribute('content',theme==='light'?'#f7f1e7':'#0a0807')}catch(e){}$('themeB').innerHTML=ico(theme==='light'?'moon':'sun');if(S)render()}
$('langB').onclick=()=>{lang=lang==='en'?'ar':'en';try{localStorage.setItem('lb_lang',lang)}catch(e){}applyLang()};
$('themeB').onclick=()=>{theme=theme==='light'?'dark':'light';try{localStorage.setItem('lb_theme',theme)}catch(e){}applyTheme()};
(async function init(){
  applyTheme();applyLang();
  const sv=getName();if(sv){$('cName').value=sv;$('jName').value=sv;offNames[0]=sv}
  $('muteB').innerHTML=ico(MUTE?'mute':'vol');
  const q=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,5);
  let sess=null;try{sess=JSON.parse(localStorage.getItem('lb_session'))}catch(e){}
  if(sess&&sess.code&&(!q||q===sess.code)&&await resume(sess))return;
  if(q){go('onl');tab('J');$('jCode').value=q;$('jName').focus()}
})();
})();
