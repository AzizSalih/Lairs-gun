<title>مسدس الحانة</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0807;--line:#2a2118;--fg:#f3eadf;--mut:#a39383;--acc:#d4a04a;--red:#e0402e;--neon:#ff8a3d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:'Tajawal','Cairo',system-ui,sans-serif;line-height:1.8;letter-spacing:0;word-spacing:.08em;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#3a2314 0,transparent 55%),radial-gradient(ellipse at 50% 120%,#2a0f0b 0,transparent 50%),var(--bg);overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000c 100%)}
.wrap{max-width:520px;margin:0 auto;padding:16px;padding-top:16px;position:relative;z-index:1}
h1{font-size:34px;font-weight:900;text-align:center;margin:0;color:#ffd9a0;text-shadow:0 0 8px var(--neon),0 0 24px #ff6a1f88,0 0 48px #ff6a1f44}
.sub{text-align:center;color:var(--mut);margin:0 0 16px;font-size:14px}
h3{margin:0 0 6px;font-size:16px;color:var(--acc)}
.card{background:linear-gradient(160deg,#15100d,#0b0807);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #000a,inset 0 1px 0 #fff1}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input{width:100%;background:#0a0807;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:16px}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #d4a04a33}
input.bad{border-color:var(--red);box-shadow:0 0 0 3px #e0402e44}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(#e2b25c,#b8862f);color:#1a1208;cursor:pointer;box-shadow:0 3px 0 #6d4d12,0 6px 14px #0008;transition:transform .1s}
button:active{transform:translateY(2px)}
button.g{background:linear-gradient(#2a221d,#17120f);color:var(--fg);box-shadow:0 3px 0 #0a0807,0 6px 14px #0008}
button.r{background:linear-gradient(#e0402e,#a72a1c);color:#fff;box-shadow:0 3px 0 #5e140b,0 6px 14px #0008}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1}
.hide{display:none!important}
.scr{animation:sin .4s ease-out}@keyframes sin{from{opacity:0;transform:translateY(12px)}}
/* الشعار والرئيسية */
#logo{display:block;width:190px;margin:10px auto 6px;filter:drop-shadow(0 0 16px #ff8a3d77);animation:lp 3.2s ease-in-out infinite}
@keyframes lp{50%{filter:drop-shadow(0 0 28px #ff8a3dcc)}}
.spin{transform-origin:100px 100px;animation:sp 30s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.big{display:block;width:100%;padding:20px;font-size:22px;font-weight:900;border-radius:16px;margin-top:14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:18px}.bar button{padding:6px 14px}
.seg{display:flex;gap:6px;background:#130f0d;border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:12px}
.seg button{flex:1;background:transparent;color:var(--mut);box-shadow:none}
.seg{position:relative}
.seg i{position:absolute;top:5px;bottom:5px;width:calc(50% - 8px);inset-inline-start:5px;border-radius:10px;background:rgba(255,138,61,.10);border:1.5px solid #ff8a3d;box-shadow:0 0 10px #ff8a3d99,inset 0 0 8px #ff8a3d40;transition:transform .38s cubic-bezier(.3,.9,.3,1.1)}
[dir=rtl] .seg.j i{transform:translateX(calc(-100% - 6px))}[dir=ltr] .seg.j i{transform:translateX(calc(100% + 6px))}
.seg button{position:relative;z-index:1;transition:color .25s}.seg button.on{color:#ffd9a0}
.pin{animation:pin .35s ease-out}@keyframes pin{from{opacity:0;transform:translateX(24px)}}
#xmod,#hmod,#wmod,#nmod{position:fixed;inset:0;z-index:25;background:#000b;display:grid;place-items:center;backdrop-filter:blur(3px)}
.mbox{background:linear-gradient(160deg,#17110e,#0a0706);border:1px solid var(--acc);border-radius:18px;padding:20px;width:min(88vw,360px);text-align:center;box-shadow:0 0 30px #d4a04a33,0 16px 40px #000;animation:pop .3s ease-out}
.mbox p{font-size:18px;font-weight:700;margin:4px 0 6px}
#leave{position:fixed;top:24%;left:50%;z-index:18;transform:translate(-50%,-30px) scale(.8);opacity:0;pointer-events:none;background:rgba(12,8,6,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:14px 24px;text-align:center;font-weight:900;font-size:18px;color:#fff;text-shadow:0 1px 8px #000b;box-shadow:0 8px 30px #0005;max-width:90vw}
#leave .lv-ic{font-size:32px;display:block;line-height:1.3}

function wpick(from,n){let t=0;const w=[];for(let i=from;i<n;i++){const x=Math.pow(i+1,1.3);w.push(x);t+=x}let r=Math.random()*t;for(let k=0;k<w.length;k++){r-=w[k];if(r<=0)return from+k}return n-1}
let MB=null;
function master(){const c=ac();if(!MB){const g=c.createGain();g.gain.value=.9;const cp=c.createDynamicsCompressor();g.connect(cp);cp.connect(c.destination);MB=g}return MB}
function metal(f,d,v,q,delay){if(MUTE)return;try{const c=ac(),t=c.currentTime+(delay||0),n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q||8;g.gain.value=v;s.buffer=b;s.connect(bp);bp.connect(g);g.connect(master());s.start(t);
  const o=c.createOscillator(),og=c.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.5,t);og.gain.setValueAtTime(v*.22,t);og.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(og);og.connect(master());o.start(t);o.stop(t+d)}catch(e){}}
function thunk(delay,v){if(MUTE)return;try{const c=ac(),t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.14);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(master());o.start(t);o.stop(t+.2)}catch(e){}}

function mk(n){const a=Array(n).fill(0);a[wpick(0,n)]=1;return a}

function apply(m){
  S.last=null;
  if(m.t==='join'){if(!S.players[m.pid]&&S.order.length<24){S.players[m.pid]={name:String(m.name).slice(0,16)||tr('لاعب'),alive:true,shots:0,pos:0,hit:-1,spec:false};CH[m.pid]=mk(S.n);S.order.push(m.pid)}}
  else if(m.t==='pull'||m.t==='hpull'){const p=S.players[m.pid];if(!p||!p.alive||p.pos>=S.n)return;
    if(m.t==='hpull'&&p.pos>=S.n-1){toast(tr('هذه آخر طلقة — القرار للاعب نفسه'),1);return}
    const live=CH[m.pid][p.pos];p.pos++;p.shots++;if(live){p.alive=false;p.hit=p.pos-1;p.dead=(p.dead||0)+1}else p.ok=(p.ok||0)+1;S.last={t:'shot',pid:m.pid,live:!!live,host:m.t==='hpull'}}
  else if(m.t==='rename'){const p=S.players[m.pid];if(p)p.name=String(m.name).slice(0,16)}
  else if(m.t==='one'){const p=S.players[m.pid];if(p){Object.assign(p,{alive:true,shots:0,pos:0,hit:-1,spec:false});CH[m.pid]=mk(S.n);S.last={t:'reload1',pid:m.pid}}}
  else if(m.t==='mode')resetAll(m.idx,{mode:m.idx});

  S.seq++;onState(S);
}

    if(!hold)$('hostp').innerHTML=isHost?S.order.map(id=>{const p=S.players[id];return '<div class="hrow '+(p.alive?'':'dead')+'"><b class="hn">'+esc(p.name)+'</b><div class="tools"><button class="g" data-a="minus" data-p="'+id+tr('">+ إضافة طلقة</button><button class="r hp" data-a="hpull" data-p="')+id+tr('">رمي الطلقة</button><button class="g" data-a="one" data-p="')+id+tr('">إعادة تلقيم وإحياء</button>')+((online?id!==S.host:S.order.length>1)?'<button class="g" data-a="kick" data-p="'+id+tr('">طرد</button>'):'')+'</div></div>'}).join(''):'';

$('mine').onclick=e=>{const p=e.target.dataset.p;if(p){sel=p;viewId=null;render()}};
