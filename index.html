<title>مسدس الحانة</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0807;--line:#2a2118;--fg:#f3eadf;--mut:#a39383;--acc:#d4a04a;--red:#e0402e;--neon:#ff8a3d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:'Tajawal','Cairo',system-ui,sans-serif;line-height:1.8;letter-spacing:0;word-spacing:.08em;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#3a2314 0,transparent 55%),radial-gradient(ellipse at 50% 120%,#2a0f0b 0,transparent 50%),var(--bg);overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000c 100%)}
.wrap{max-width:520px;margin:0 auto;padding:16px;padding-top:16px;position:relative;z-index:1}
h1{font-size:34px;font-weight:900;text-align:center;margin:0;color:#ffd9a0;text-shadow:0 0 8px var(--neon),0 0 24px #ff6a1f88,0 0 48px #ff6a1f44}
.sub{text-align:center;color:var(--mut);margin:0 0 16px;font-size:14px}
h3{margin:0 0 6px;font-size:16px;color:var(--acc)}
.card{background:linear-gradient(160deg,#15100d,#0b0807);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #000a,inset 0 1px 0 #fff1}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input{width:100%;background:#0a0807;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:16px}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #d4a04a33}
input.bad{border-color:var(--red);box-shadow:0 0 0 3px #e0402e44}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(#e2b25c,#b8862f);color:#1a1208;cursor:pointer;box-shadow:0 3px 0 #6d4d12,0 6px 14px #0008;transition:transform .1s}
button:active{transform:translateY(2px)}
button.g{background:linear-gradient(#2a221d,#17120f);color:var(--fg);box-shadow:0 3px 0 #0a0807,0 6px 14px #0008}
button.r{background:linear-gradient(#e0402e,#a72a1c);color:#fff;box-shadow:0 3px 0 #5e140b,0 6px 14px #0008}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1}
.hide{display:none!important}
.scr{animation:sin .4s ease-out}@keyframes sin{from{opacity:0;transform:translateY(12px)}}
/* الشعار والرئيسية */
#logo{display:block;width:190px;margin:10px auto 6px;filter:drop-shadow(0 0 16px #ff8a3d77);animation:lp 3.2s ease-in-out infinite}
@keyframes lp{50%{filter:drop-shadow(0 0 28px #ff8a3dcc)}}
.spin{transform-origin:100px 100px;animation:sp 30s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.big{display:block;width:100%;padding:20px;font-size:22px;font-weight:900;border-radius:16px;margin-top:14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:18px}.bar button{padding:6px 14px}
.seg{display:flex;gap:6px;background:#130f0d;border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:12px}
.seg button{flex:1;background:transparent;color:var(--mut);box-shadow:none}
.seg{position:relative}
.seg i{position:absolute;top:5px;bottom:5px;width:calc(50% - 8px);inset-inline-start:5px;border-radius:10px;background:rgba(255,138,61,.10);border:1.5px solid #ff8a3d;box-shadow:0 0 10px #ff8a3d99,inset 0 0 8px #ff8a3d40;transition:transform .38s cubic-bezier(.3,.9,.3,1.1)}
[dir=rtl] .seg.j i{transform:translateX(calc(-100% - 6px))}[dir=ltr] .seg.j i{transform:translateX(calc(100% + 6px))}
.seg button{position:relative;z-index:1;transition:color .25s}.seg button.on{color:#ffd9a0}
.pin{animation:pin .35s ease-out}@keyframes pin{from{opacity:0;transform:translateX(24px)}}
#xmod,#hmod,#wmod,#nmod{position:fixed;inset:0;z-index:25;background:#000b;display:grid;place-items:center;backdrop-filter:blur(3px)}
.mbox{background:linear-gradient(160deg,#17110e,#0a0706);border:1px solid var(--acc);border-radius:18px;padding:20px;width:min(88vw,360px);text-align:center;box-shadow:0 0 30px #d4a04a33,0 16px 40px #000;animation:pop .3s ease-out}
.mbox p{font-size:18px;font-weight:700;margin:4px 0 6px}
#leave{position:fixed;top:24%;left:50%;z-index:18;transform:translate(-50%,-30px) scale(.8);opacity:0;pointer-events:none;background:rgba(12,8,6,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:14px 24px;text-align:center;font-weight:900;font-size:18px;color:#fff;text-shadow:0 1px 8px #000b;box-shadow:0 8px 30px #0005;max-width:90vw}
#leave .lv-ic{font-size:32px;display:block;line-height:1.3}
#leave.show{animation:lv 2.8s ease-out}
@keyframes lv{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,24px) scale(.95)}}
.hp{--hp:0;background:linear-gradient(to left,#ff7a5c calc(var(--hp)*100%),#a72a1c 0)!important;touch-action:none;user-select:none;-webkit-user-select:none}
#trig.last{animation:lastp 1.2s ease-in-out infinite}
@keyframes lastp{50%{box-shadow:0 0 0 4px #3b424c,0 14px 30px #000a,0 0 34px var(--red)}}
#dl{transform-origin:54px 90px;animation:swl 4.5s ease-in-out infinite}#dr{transform-origin:146px 90px;animation:swr 4.5s ease-in-out infinite}
@keyframes swl{50%{transform:rotate(-3deg)}}@keyframes swr{50%{transform:rotate(3deg)}}
.eyes{transform-origin:100px 68px;animation:blink 5s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* المظهر الفاتح */
[data-theme=light]{--bg:#f7f1e7;--line:#c9b48f;--fg:#1d130a;--mut:#5a4a39;--acc:#8f5e0f;--red:#c4301f;--neon:#d1601a;color-scheme:light}
[data-theme=light] body{background:radial-gradient(ellipse at 50% -10%,#fff6e6,transparent 60%),var(--bg)}
[data-theme=light] body::after{display:none}
[data-theme=light] h1{color:#7a3a0c;text-shadow:0 1px 0 #fff,0 0 12px #ff8a3d55}
[data-theme=light] #hdr{background:#fffdf9}
[data-theme=light] .card,[data-theme=light] .mbox{background:#fffdf9;border-color:#c9b48f;box-shadow:0 4px 14px #6b4a2a26,inset 0 1px 0 #fff}
[data-theme=light] input{background:#fff;color:var(--fg);border-color:#b9a27a}
[data-theme=light] input::placeholder{color:#8a7a66}
[data-theme=light] button.g{background:#efe3cc;color:#2a1d12;border:1px solid #c9b48f;box-shadow:0 2px 0 #c9b48f}
[data-theme=light] button{box-shadow:0 2px 0 #8f6a1c}
[data-theme=light] button.r{box-shadow:0 2px 0 #7e1e12}
[data-theme=light] .seg{background:#efe3cc;border-color:#c9b48f}
[data-theme=light] .seg button{color:#5a4a39}[data-theme=light] .seg button.on{color:#8f3d06}
[data-theme=light] .chip{background:#efe3cc;color:#2a1d12;border-color:#c9b48f}
[data-theme=light] .chip.on{background:#fff3d6;color:#6b4508;border-color:#a8741b}
[data-theme=light] .mc{background:linear-gradient(160deg,hsl(var(--h) 65% 93%),#fffdf9);color:var(--fg);border-color:hsl(var(--h) 45% 55%)}
[data-theme=light] .mc b{color:#1d130a;text-shadow:none}
[data-theme=light] .mc .bd{background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 75% 26%);border-color:hsl(var(--h) 50% 55%)}
[data-theme=light] .mc .dt u{background:#d6c7ad}
[data-theme=light] .pl.dead{background:#c4301f1a}
[data-theme=light] .code{background:#d1601a1f}
[data-theme=light] #toast{background:#fffdf9;color:var(--fg);border-color:#a8741b}
[data-theme=light] #jErr{background:#fde6e1;color:#7a1e12}
[data-theme=light] #trig span{color:#fff}
[data-theme=light] #reload::before{background:#d4a04a99}
[data-theme=light] .sub{color:#5a4a39}
@media(prefers-reduced-motion:reduce){#dl,#dr,.eyes{animation:none!important}}
#jErr{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:#3a0f0a;border:1px solid var(--red);color:#ffb3a8;font-weight:700;font-size:14px}
#jErr.show{display:block;animation:shk .4s}

@keyframes dth{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
#death .dw{display:flex;flex-direction:column;align-items:center;gap:14px;background:transparent !important;border:none !important;box-shadow:none !important}
#death .dw>div{animation:dpop .5s ease-out}

.pl[data-v]{border-radius:12px;padding:9px 12px;margin:4px 0;border-bottom:none !important}
.pl.dead[data-v]{border-radius:12px;padding-inline:12px}
[dir=rtl]{--sx:-26px}[dir=ltr]{--sx:26px}
#cyl.swap,#vname.swap{animation:swapin .3s ease}

.big .ib{margin-top:-3px}
.big>span:last-child{line-height:1.25}
#hdr{flex-wrap:nowrap !important;gap:4px !important;padding-inline:max(8px,calc((100vw - 520px)/2 + 8px)) !important}

function mk(n){const a=Array(n).fill(0);a[wpick(0,n)]=1;return a}
function newGame(idx){CH={};return{mode:idx,n:MODES[idx][1],players:{},order:[],votes:[],seq:0,last:null}}

function apply(m){
  S.last=null;
  if(m.t==='join'){if(!S.players[m.pid]&&S.order.length<24){S.players[m.pid]={name:String(m.name).slice(0,16)||tr('لاعب'),alive:true,shots:0,pos:0,hit:-1,spec:false};CH[m.pid]=mk(S.n);S.order.push(m.pid)}}
  else if(m.t==='pull'||m.t==='hpull'){const p=S.players[m.pid];if(!p||!p.alive||p.pos>=S.n)return;
    if(m.t==='hpull'&&p.pos>=S.n-1){toast(tr('هذه آخر طلقة — القرار للاعب نفسه'),1);return}
    const live=CH[m.pid][p.pos];p.pos++;p.shots++;if(live){p.alive=false;p.hit=p.pos-1;p.dead=(p.dead||0)+1}else p.ok=(p.ok||0)+1;S.last={t:'shot',pid:m.pid,live:!!live,host:m.t==='hpull'}}
  else if(m.t==='rename'){const p=S.players[m.pid];if(p)p.name=String(m.name).slice(0,16)}
  else if(m.t==='one'){const p=S.players[m.pid];if(p){Object.assign(p,{alive:true,shots:0,pos:0,hit:-1,spec:false});CH[m.pid]=mk(S.n);S.last={t:'reload1',pid:m.pid}}}
  else if(m.t==='mode')resetAll(m.idx,{mode:m.idx});
  else if(m.t==='vote'){if(S.players[m.pid]&&!S.votes.includes(m.pid))S.votes.push(m.pid);if(S.order.every(id=>S.votes.includes(id)))resetAll(S.mode)}
  else if(m.t==='kick'){const kn=(S.players[m.pid]||{}).name;delete S.players[m.pid];delete CH[m.pid];S.last={t:'left',name:kn};S.order=S.order.filter(x=>x!==m.pid);S.votes=S.votes.filter(x=>x!==m.pid)}
  else if(m.t==='adj'){const p=S.players[m.pid];if(p){if(m.d<0&&p.pos>0){p.pos--;p.shots=Math.max(0,p.shots-1);if(p.hit===p.pos){p.hit=-1;p.alive=true}}}}
  S.seq++;onState(S);
}

$('hostp').addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-a="hpull"]');if(!b)return;e.preventDefault();hold={p:b.dataset.p,t0:performance.now(),raf:0};hpTick()});
function hpBtn(p){return $('hostp').querySelector('button[data-a="hpull"][data-p="'+p+'"]')}
function hpTick(){if(!hold)return;const k=Math.min(1,(performance.now()-hold.t0)/HP),b=hpBtn(hold.p);if(b)b.style.setProperty('--hp',k);
  if(k>=1){const p=hold.p;hold=null;buzz(0);act({t:'hpull',pid:p});render();return}hold.raf=requestAnimationFrame(hpTick)}
function hpEnd(){if(!hold)return;cancelAnimationFrame(hold.raf);const b=hpBtn(hold.p);if(b)b.style.setProperty('--hp',0);hold=null;render()}
document.addEventListener('pointerup',hpEnd);document.addEventListener('pointercancel',hpEnd);
const RP=1200;let rhold=null;
function reloadDo(){if(!S)return;if(!online){S.order.forEach(id=>apply({t:'vote',pid:id}));return}
  const mine=local.filter(p=>S.players[p]);if(!mine.length)return;
  const voted=mine.every(p=>S.votes.includes(p));mine.forEach(p=>act({t:voted?'unvote':'vote',pid:p}))}
function rpTick(){if(!rhold)return;const k=Math.min(1,(performance.now()-rhold.t0)/RP);$('reload').style.setProperty('--rp',k);
  if(k>=1){rhold=null;$('reload').style.setProperty('--rp',0);buzz(0);reloadDo();return}rhold.raf=requestAnimationFrame(rpTick)}
function rpEnd(){if(!rhold)return;cancelAnimationFrame(rhold.raf);$('reload').style.setProperty('--rp',0);rhold=null;buzz(0)}
$('reload').addEventListener('pointerdown',e=>{e.preventDefault();rhold={t0:performance.now(),raf:0};sTrig();buzz(Array(12).fill([40,60]).flat());rpTick()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('reload').addEventListener(ev,rpEnd));
$('reload').addEventListener('contextmenu',e=>e.preventDefault());
let nmPid=null;
function openName(pid){if(!S||!S.players[pid])return;nmPid=pid;$('nmIn').value=S.players[pid].name;$('nmod').classList.remove('hide');$('nmIn').focus()}
function closeName(){$('nmod').classList.add('hide');nmPid=null}
function nameTaken(v,ex){if(!S)return false;const k=String(v).trim().toLowerCase();return Object.keys(S.players).some(id=>id!==ex&&String(S.players[id].name).trim().toLowerCase()===k)}
function saveNick(){const v=$('nmIn').value.trim().slice(0,16),pid=nmPid;if(v&&pid&&nameTaken(v,pid)){toast(tr('الاسم هذا مستخدم بالفعل، اختر اسماً آخر'),1);return}closeName();if(!v||!pid)return;
  if(online)ROOM.child('players/'+pid).transaction(p=>{if(!p)return p;p.name=v;return p});else apply({t:'rename',pid,name:v})}
$('nmOk').onclick=saveNick;$('nmNo').onclick=closeName;
$('nmIn').addEventListener('keydown',e=>{if(e.key==='Enter')saveNick()});
function getTriggerPullText(count){
  if(lang==='en')return count===0?'Survived without pulling the trigger':count===1?'Survived 1 trigger pull':'Survived '+count+' trigger pulls';
  if(count===0)return 'نجا بدون أي سحب للزناد';
  if(count===1)return 'نجا من سحبة واحدة للزناد';
  if(count===2)return 'نجا من سحبتين للزناد';
  if(count>=3&&count<=10)return 'نجا من '+count+' سحبات للزناد';
  return 'نجا من '+count+' سحبة للزناد';
}
let wKey=null,wDone=null;
function winCheck(){const al=S.order.filter(id=>S.players[id].alive&&!S.players[id].spec),dd=S.order.some(id=>!S.players[id].alive&&!S.players[id].spec);
  if(S.order.length>=2&&al.length===1&&dd){const wid=al[0],key=(S.round||0)+':'+wid;
    if(key!==wDone&&key!==wKey){wKey=key;setTimeout(()=>{if(wKey!==key||!S)return;const p=S.players[wid];if(!p)return;$('wname').textContent=p.name;$('wsub').textContent=getTriggerPullText(p.shots);$('wmod').classList.remove('hide');fanfare()},1500)}}
  else{wKey=null;wDone=null;$('wmod').classList.add('hide')}}
$('wclose').onclick=()=>{wDone=wKey;$('wmod').classList.add('hide')};
$('wnew').onclick=()=>{clearAlerts();wDone=wKey;$('wmod').classList.add('hide');if(!S)return;
  if(!online)S.order.forEach(id=>apply({t:'vote',pid:id}));
  else if(isHost)act({t:'newround'});
  else{local.filter(p=>S.players[p]).forEach(p=>act({t:'vote',pid:p}));toast(tr('تم إرسال طلب جولة جديدة'))}};
$('hostB').onclick=()=>{$('hmod').classList.remove('hide');if(S)render()};
$('hClose').onclick=()=>$('hmod').classList.add('hide');
$('hmod').onclick=e=>{if(e.target===$('hmod'))$('hmod').classList.add('hide')};
$('addB').onclick=()=>{$('addRow').classList.toggle('hide');if(!$('addRow').classList.contains('hide'))$('more').focus()};

/* ---------- الزناد: ضغط مطوّل ---------- */
const trig=$('trig');let t0=0,raf=0,holding=false;
function tick(){if(!holding)return;const k=Math.min(1,(performance.now()-t0)/HOLD);trig.style.setProperty('--p',k);$('cyl').style.transform='scale('+(1+.06*k)+')';if(k>=1){fire();return}raf=requestAnimationFrame(tick)}
function cancel(){if(!holding)return;holding=false;cancelAnimationFrame(raf);chargeStop();buzz(0);trig.style.setProperty('--p',0);$('cyl').style.transform=''}
function fire(){holding=false;chargeStop();buzz(0);trig.style.setProperty('--p',0);$('cyl').style.transform='';act({t:'pull',pid:curView})}
trig.addEventListener('pointerdown',e=>{if(trig.disabled)return;e.preventDefault();try{trig.setPointerCapture(e.pointerId)}catch(_){}
  holding=true;t0=performance.now();tapFx();sTrig();chargeStart();buzz(Array(30).fill([40,60]).flat());raf=requestAnimationFrame(tick)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>trig.addEventListener(ev,cancel));
trig.addEventListener('contextmenu',e=>e.preventDefault());

$('muteB').onclick=()=>{MUTE=!MUTE;try{localStorage.setItem('lb_mute',MUTE?'1':'0')}catch(e){}$('muteB').innerHTML=ico(MUTE?'mute':'vol')};
/* ---------- البدء: استئناف الجلسة أو الانضمام عبر الرابط ---------- */
const DYN='#info,#vname,#mine,#plist,#hostp,#statsp,#msg,#voteInfo,#trig,#reload,#offNames,.mcs,#toast,#jErr,#leaveT,#lastHint,#wname,#wsub';
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){const pe=n.parentElement;if(!pe||pe.closest(DYN)||/^(SCRIPT|STYLE)$/.test(pe.tagName))continue;
    if(n._ar===undefined){const k=n.nodeValue.trim();if(!/[\u0600-\u06FF]/.test(k))continue;n._ar=n.nodeValue;n._k=k}
    n.nodeValue=(lang==='en'&&DICT[n._k]!=null)?n._ar.replace(n._k,DICT[n._k]):n._ar}
  document.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{if(!el.hasAttribute(a))return;const d='_a_'+a;
    if(el[d]===undefined){if(!/[\u0600-\u06FF]/.test(el.getAttribute(a)))return;el[d]=el.getAttribute(a)}
    el.setAttribute(a,(lang==='en'&&DICT[el[d]]!=null)?DICT[el[d]]:el[d])}));
  document.title=tr('مسدس الحانة');$('langB').textContent=lang==='en'?'ع':'EN';
  for(const id in cards.f)cards(id,cards.f[id]);paint('ocards',offMode);paint('ccards',crMode);if(S)paint('hcards',S.mode);
  if($('offNames').children.length)offRender();
  if(S)render();else{$('trig').querySelector('span').textContent=tr('الزناد');$('reload').textContent=tr('إعادة التلقيم')}
}
function applyTheme(){document.documentElement.dataset.theme=theme;document.documentElement.classList.toggle('light-mode',theme==='light');document.body.classList.toggle('light-mode',theme==='light');try{$('cs').setAttribute('content',theme==='light'?'light':'dark')}catch(e){}try{$('tc').setAttribute('content',theme==='light'?'#f7f1e7':'#0a0807')}catch(e){}$('themeB').innerHTML=ico(theme==='light'?'moon':'sun');if(S)render()}
$('langB').onclick=()=>{lang=lang==='en'?'ar':'en';try{localStorage.setItem('lb_lang',lang)}catch(e){}applyLang()};
$('themeB').onclick=()=>{theme=theme==='light'?'dark':'light';try{localStorage.setItem('lb_theme',theme)}catch(e){}applyTheme()};
(async function init(){
  applyTheme();applyLang();
  const sv=getName();if(sv){$('cName').value=sv;$('jName').value=sv;offNames[0]=sv}
  $('muteB').innerHTML=ico(MUTE?'mute':'vol');
  const q=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,5);
  let sess=null;try{sess=JSON.parse(localStorage.getItem('lb_session'))}catch(e){}
  if(sess&&sess.code&&(!q||q===sess.code)&&await resume(sess))return;
  if(q){go('onl');tab('J');$('jCode').value=q;$('jName').focus()}
})();
})();
</script>
